<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>フォームバリデーション</title>
  </head>
  <body>
    <h1>ユーザー登録フォーム ✅</h1>
    <form id="form-validation" class="form-area">
      <div class="form-group">
        <label for="username-input" class="form-label">ユーザー名</label>
        <input type="text" id="username-input" class="form-input">
        <p class="error-message" id="username-error"></p>
      </div>
      <div class="form-group">
        <label for="email-input" class="form-label">メールアドレス</label>
        <input type="email" id="email-input" class="form-input">
        <p class="error-message" id="email-error"></p>
      </div>
      <div class="form-group">
        <label for="password-input" class="form-label">パスワード</label>
        <input type="text" id="password-input" class="form-input">
        <p class="error-message" id="password-error"></p>
      </div>

      <button type="submit" class="submit-button">登録</button>
    </form>
    <script type="module" src="/src/apps/05-form-validation/main.ts"></script>
  </body>
</html>
